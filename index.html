<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snake-game</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <h1>Snake Game</h1>
    <label>
        Level:
        <select id="level-select"></select>
    </label>
    <div id="time">Remaining: 0s</div>
    <div id="scores">Score: 0</div>
    <div id="food">Food eaten: 0</div>
    <div id="speed-up">Speed: 1.0x</div>

    <br>
    <div id="health">Health: 0</div>
    <br>

    <div id="tick-count">Ticks: 0</div>
    <ul id="missions"></ul>
    <div id="effects">current effects: none</div>
    <div id="game-board"></div>
    <script src="js/game.js"></script>
</body>

</html>
