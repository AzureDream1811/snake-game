<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snake-game</title>
    <style>
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 0;
            min-height: 100vh;
        }

        #game-board {
            display: grid;
            background: black;
        }

        .cell {
            position: relative;
            box-sizing: border-box;
        }

        .snake {
            background: green;
            border-radius: 20%;
        }

        .snake-shield {
            animation: rainbow 1s linear infinite;
            box-shadow: 0 0 8px 2px rgba(255, 255, 255, 0.8);
        }

        @keyframes rainbow {
            from {
                filter: hue-rotate(0deg) brightness(1.4);
            }

            to {
                filter: hue-rotate(360deg) brightness(1.4);
            }
        }

        .food::after {
            content: "";
            position: absolute;
            inset: 15%;
            border-radius: 50%;
            background: var(--food-color);
        }

        .food {
            border-radius: 50%;
            transform: scale(0.8);
        }

        .food-normal {
            --food-color: red;
        }

        .food-slow {
            --food-color: #5c00f1;
        }

        .food-speed {
            --food-color: #FFD23F;
        }

        .food-extraFood {
            --food-color: #FF6B9D;
        }

        .food-extraTime {
            --food-color: #2ECC71;
        }

        .food-poison {
            --food-color: #5c00f1;
        }

        .obstacle {
            background: gray;
        }

        .moving-obstacle {
            background: orange;
        }

        #keys {
            border-collapse: collapse;
            margin-top: 12px;
        }

        #keys caption {
            font-weight: bold;
            text-align: left;
            margin-bottom: 4px;
        }

        #keys td {
            border: 1px solid #ccc;
            padding: 2px 8px;
        }

        #pause-button {
            margin-bottom: 12px;
        }

        #game-board.paused {
            opacity: 0.5;
        }

        #level-buttons {
            display: flex;
            gap: 8px;
            margin-bottom: 12px;
        }

        #level-buttons button.active {
            background: green;
            color: white;
        }

        #hud {
            display: flex;
            flex-wrap: wrap;
            gap: 4px 16px;
            margin-bottom: 12px;
        }

        #side-panel {
            width: 220px;
            overflow-wrap: anywhere;
        }

        #game-area {
            display: flex;
            gap: 16px;
            align-items: flex-start;
        }

        #game-board {
            display: grid;
            background: black;
        }

        .hazard-warning {
            background-image: repeating-linear-gradient(45deg, rgba(198, 255, 0, 0.25) 0 3px, transparent 3px 8px);
            box-shadow: inset 0 0 0 1px rgba(198, 255, 0, 0.5);
        }

        .hazard-active {
            background-image: repeating-linear-gradient(45deg, rgba(198, 255, 0, 0.7) 0 4px, rgba(0, 0, 0, 0.5) 4px 8px);
            box-shadow: inset 0 0 8px #c6ff00;
            animation: pulse 1s infinite alternate;
        }

        @keyframes pulse {
            from {
                filter: brightness(0.8);
            }

            to {
                filter: brightness(1.3);
            }
        }

        /*# sourceMappingURL=style.css.map */
    </style>

</head>

<body>
    <p id="links">
        <a href="https://github.com/AzureDream1811/snake-game" target="_blank" rel="noopener">GitHub</a> |
        <a href="https://docs.google.com/document/d/1_0jsPAP5Mg7oID_XaXUXvMBWcBm_wSRil_Z9x-jBl0s/edit?usp=sharing"
            target="_blank" rel="noopener">Tutorial</a>
    </p>
    <h1>Snake Game</h1>
    <div id="level-buttons">
        <button data-level="1">Level 1</button>
        <button data-level="2">Level 2</button>
        <button data-level="3">Level 3</button>
        <button data-level="4">Level 4</button>
        <button data-level="5">Level 5</button>
    </div>
    <button id="pause-button">Pause</button>

    <div id="hud">
        <div id="scores">Score: 0</div>
        <div id="combo">
            <div id="combo-multiplier">Combo: 0</div>
            <div id="combo-duration">Duration: 0s</div>
        </div>

        <div id="health">Health: 0</div>
        <div id="mana">Mana: 0</div>
        <div id="time">Remaining: 0s</div>
        <div id="food">Food eaten: 0</div>
        <div id="speed-up">Speed: 1.0x</div>
        <div id="tick-count">Ticks: 0</div>
    </div>

    <div id="game-area">
        <div id="game-board"></div>
        <aside id="side-panel">
            <div id="effects">Current effects: none</div>
            <div id="missions">Current missions: none</div>
            <table id="keys">
                <caption>Controls</caption>
                <tr>
                    <td>W / &uarr;</td>
                    <td>Up</td>
                </tr>
                <tr>
                    <td>S / &darr;</td>
                    <td>Down</td>
                </tr>
                <tr>
                    <td>A / &larr;</td>
                    <td>Left</td>
                </tr>
                <tr>
                    <td>D / &rarr;</td>
                    <td>Right</td>
                </tr>
                <tr>
                    <td>Space</td>
                    <td>Shield (Level 5)</td>
                </tr>
                <tr>
                    <td>P / Esc</td>
                    <td>Pause / Resume</td>
                </tr>
                <tr>
                    <td>1 - 5</td>
                    <td>Select level</td>
                </tr>
            </table>
        </aside>
    </div>
    <script src="game.js"></script>
</body>

</html>
